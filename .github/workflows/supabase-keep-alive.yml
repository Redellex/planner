# Supabase pauses a free project after 7 days without activity.
# This sends one database query every 3 days so the hosted project stays up.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the hosted database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::The SUPABASE_URL or SUPABASE_KEY repository secret is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          status=$(curl -sS --max-time 30 -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY") || {
            echo "::error::Could not reach Supabase (curl exit code $?)."
            exit 1
          }
          echo "Supabase answered HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase answered HTTP $status, expected 200 (401/403: check SUPABASE_KEY; 5xx: the project may be paused)."
            exit 1
          fi
